<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1080px;
    background: #FFDD04;
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 80px;
    position: relative;
    overflow: hidden;
  }
  .logo {
    position: absolute;
    top: 50px;
    left: 60px;
    font-size: 28px;
    font-weight: 800;
    color: #1a1a1a;
    letter-spacing: -0.5px;
  }
  .slide-num {
    position: absolute;
    top: 50px;
    right: 60px;
    font-size: 20px;
    font-weight: 600;
    color: rgba(0,0,0,0.3);
  }
  h1 {
    font-size: 72px;
    font-weight: 900;
    color: #1a1a1a;
    text-align: center;
    line-height: 1.15;
    letter-spacing: -2px;
    max-width: 900px;
  }
  .subtitle {
    font-size: 32px;
    font-weight: 500;
    color: rgba(0,0,0,0.6);
    text-align: center;
    margin-top: 30px;
    max-width: 700px;
    line-height: 1.4;
  }
  .swipe {
    position: absolute;
    bottom: 50px;
    right: 60px;
    font-size: 20px;
    font-weight: 700;
    color: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .arrow { font-size: 28px; }
  .decoration {
    position: absolute;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    top: -80px;
    right: -80px;
  }
  .decoration2 {
    position: absolute;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    bottom: -60px;
    left: -40px;
  }
</style>
</head>
<body>
  <div class="decoration"></div>
  <div class="decoration2"></div>
  <div class="logo">shoperly</div>
  <div class="slide-num">1/5</div>
  <h1>5 errores que matan tu tienda online</h1>
  <p class="subtitle">Y cómo solucionarlos en minutos 🚀</p>
  <div class="swipe">Desliza <span class="arrow">→</span></div>
</body>
</html>
