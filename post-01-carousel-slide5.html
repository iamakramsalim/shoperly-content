<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1080px;
    background: #FFDD04;
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 80px;
    position: relative;
    overflow: hidden;
  }
  .logo { position: absolute; top: 50px; left: 60px; font-size: 28px; font-weight: 800; color: #1a1a1a; }
  .slide-num { position: absolute; top: 50px; right: 60px; font-size: 20px; font-weight: 600; color: rgba(0,0,0,0.3); }
  h1 {
    font-size: 64px;
    font-weight: 900;
    color: #1a1a1a;
    text-align: center;
    line-height: 1.15;
    letter-spacing: -2px;
    max-width: 850px;
    margin-bottom: 30px;
  }
  .subtitle {
    font-size: 30px;
    font-weight: 500;
    color: rgba(0,0,0,0.6);
    text-align: center;
    max-width: 700px;
    line-height: 1.4;
    margin-bottom: 50px;
  }
  .cta {
    background: #1a1a1a;
    color: #FFDD04;
    font-size: 32px;
    font-weight: 800;
    padding: 24px 60px;
    border-radius: 60px;
    letter-spacing: -0.5px;
  }
  .url {
    position: absolute;
    bottom: 50px;
    font-size: 24px;
    font-weight: 600;
    color: rgba(0,0,0,0.4);
  }
  .decoration {
    position: absolute;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    bottom: -80px;
    right: -80px;
  }
</style>
</head>
<body>
  <div class="decoration"></div>
  <div class="logo">shoperly</div>
  <div class="slide-num">5/5</div>
  <h1>Creá tu tienda online gratis en 5 minutos</h1>
  <p class="subtitle">Sin código. Sin complicaciones. Solo vos y tus productos.</p>
  <div class="cta">Creá tu tienda gratis</div>
  <div class="url">shoperly.app — Link en bio 👆</div>
</body>
</html>
