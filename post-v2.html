<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    position: relative;
    overflow: hidden;
    font-family: 'Inter', -apple-system, sans-serif;
  }
  .bg {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  /* Dark gradient overlay — heavier at top and bottom */
  .overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.75) 0%,
      rgba(0,0,0,0.2) 40%,
      rgba(0,0,0,0.15) 55%,
      rgba(0,0,0,0.7) 85%,
      rgba(0,0,0,0.85) 100%
    );
  }
  .content {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 60px;
  }
  .logo {
    font-size: 32px;
    font-weight: 900;
    color: #FFDD04;
    letter-spacing: -0.5px;
  }
  .headline {
    font-size: 96px;
    font-weight: 900;
    color: #FFFFFF;
    line-height: 1.0;
    letter-spacing: -3px;
    text-transform: uppercase;
    max-width: 900px;
  }
  .headline .accent {
    color: #FFDD04;
  }
  .bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .subtitle {
    font-size: 30px;
    font-weight: 900;
    color: rgba(255,255,255,0.8);
    text-transform: uppercase;
    letter-spacing: 3px;
    max-width: 600px;
    line-height: 1.4;
  }
  .cta {
    background: #FFDD04;
    color: #1a1a1a;
    font-size: 24px;
    font-weight: 900;
    padding: 18px 40px;
    border-radius: 50px;
    text-transform: uppercase;
    letter-spacing: 1px;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <img class="bg" src="bg-photo.png" />
  <div class="overlay"></div>
  <div class="content">
    <div class="logo">shoperly</div>
    <div>
      <div class="headline">
        TU NEGOCIO<br>
        MERECE<br>
        <span class="accent">MÁS</span>
      </div>
    </div>
    <div class="bottom">
      <div class="subtitle">Creá tu tienda online gratis en minutos</div>
      <div class="cta">shoperly.app</div>
    </div>
  </div>
</body>
</html>
