<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1920px;
    background: {{BG_COLOR}};
    font-family: 'Inter', -apple-system, sans-serif;
    position: relative;
    overflow: hidden;
  }

  /* Background texture */
  .bg-dots {
    position: absolute; inset: 0; z-index: 0;
    background-image: radial-gradient({{DOT_COLOR}} 1.5px, transparent 1.5px);
    background-size: 40px 40px;
  }

  /* Large emoji watermark — fills dead zone bottom-right */
  .emoji-watermark {
    position: absolute;
    bottom: 60px; right: 20px;
    font-size: 260px;
    opacity: {{WATERMARK_OPACITY}};
    z-index: 1;
    transform: rotate(-15deg);
  }

  /* Yellow side bar */
  .side-bar {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 12px;
    background: #FFDD04;
    z-index: 5;
  }

  /* Bottom gradient to fill dead zone */
  .bottom-fade {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 450px;
    background: linear-gradient(to bottom, transparent 0%, {{BOTTOM_FADE}} 100%);
    z-index: 2;
  }

  /* Content wrapper — safe zone, but pushed to use more vertical space */
  .safe {
    position: absolute;
    top: 130px; left: 80px; right: 140px; bottom: 340px;
    display: flex;
    flex-direction: column;
    z-index: 10;
  }

  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 40px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .logo svg.icon { width: 56px; height: 50px; }
  .logo svg.wordmark { height: 34px; width: auto; }
  .slide-num {
    font-size: 28px;
    font-weight: 800;
    color: {{NUM_COLOR}};
    letter-spacing: 2px;
  }

  /* Main content fills available space */
  .middle {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 24px;
  }

  .step-row {
    display: flex;
    align-items: baseline;
    gap: 20px;
  }
  .step-num {
    font-size: 110px;
    font-weight: 900;
    color: {{STEP_NUM_COLOR}};
    line-height: 1;
    letter-spacing: -4px;
  }
  .step-emoji {
    font-size: 72px;
    line-height: 1;
  }

  .point-title {
    font-size: 62px;
    font-weight: 900;
    color: {{TEXT_COLOR}};
    line-height: 1.08;
    letter-spacing: -2px;
    text-transform: uppercase;
    max-width: 760px;
  }

  .divider {
    width: 60px; height: 4px;
    background: #FFDD04;
    border-radius: 2px;
    margin: 4px 0;
  }

  .point-body {
    font-size: 38px;
    font-weight: 500;
    color: {{BODY_COLOR}};
    line-height: 1.5;
    max-width: 720px;
  }

  .tip-box {
    background: {{TIP_BG}};
    padding: 28px 32px;
    border-radius: 20px;
    border-left: 6px solid {{TIP_BORDER}};
    max-width: 760px;
    margin-top: 8px;
  }
  .tip-label {
    font-size: 18px;
    font-weight: 800;
    color: {{TIP_LABEL_COLOR}};
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 8px;
  }
  .tip-text {
    font-size: 32px;
    font-weight: 700;
    color: {{TIP_TEXT_COLOR}};
    line-height: 1.4;
  }

  /* Progress bar at bottom of safe zone */
  .progress-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 40px;
  }
  .prog-seg {
    height: 6px;
    border-radius: 3px;
    flex: 1;
    background: {{DOT_INACTIVE}};
  }
  .prog-seg.done {
    background: {{PROG_DONE}};
  }
  .prog-seg.current {
    background: {{PROG_CURRENT}};
  }
</style>
</head>
